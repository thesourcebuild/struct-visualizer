name: Verify

on:
  pull_request:
  push:
    branches-ignore: [main, master]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # On one Node version: the compilers' answers do not depend on it.
      - name: Install the compilers the layout ground truth checks against
        if: matrix.node == 22
        uses: ./.github/actions/cross-compilers
        # A crawling mirror fails the run here, instead of holding it for the 6 h job limit.
        timeout-minutes: 60
      # Zig is the ground truth of the Zig tools (tests/zig-compiler.test.ts). Bindings are compiled by
      # their own languages (tests/bindings.test.ts): Zig and Rust check them for the target, C# with
      # .NET 9; Go and Python are on the runner already.
      - name: Install Zig, and the toolchains the bindings are checked with
        if: matrix.node == 22
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-dotnet@v6
        if: matrix.node == 22
        with:
          dotnet-version: 9.0.x
      # Every target the Rust engine and the Rust bindings are checked on: rustup ships the library of
      # most; the tier-3 ones (MIPS, AVR) have core built from source on nightly (-Zbuild-std).
      - name: Add the Rust targets
        if: matrix.node == 22
        run: |
          rustup target add x86_64-pc-windows-msvc x86_64-apple-darwin aarch64-apple-darwin i686-unknown-linux-gnu i686-pc-windows-msvc armv7-unknown-linux-gnueabihf thumbv7em-none-eabihf aarch64-unknown-linux-gnu riscv32imac-unknown-none-elf riscv64gc-unknown-linux-gnu powerpc-unknown-linux-gnu wasm32-unknown-unknown
          rustup toolchain install nightly --profile minimal -c rust-src
          echo "nightly=$(rustup run nightly rustc --version | tr -c 'A-Za-z0-9.-' '_')" >> "$GITHUB_OUTPUT"
        id: rust
      # The core the tier-3 targets need, built by that nightly: reused until nightly changes.
      - name: Cache core built for the tier-3 Rust targets
        if: matrix.node == 22
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rust-build-std
          key: rust-build-std-${{ runner.os }}-${{ steps.rust.outputs.nightly }}
      - run: pnpm typecheck
      - run: pnpm lint
      # TODO: add `pnpm format:check` after the one-off `pnpm format` commit
      # (kept separate from the monorepo move so git still detects the renames).
      - run: pnpm test
        env:
          # Fail, rather than skip, a target whose compiler did not install.
          SP_REQUIRE_COMPILERS: ${{ matrix.node == 22 && '1' || '' }}
          SP_REQUIRE_BINDING_TOOLCHAINS: ${{ matrix.node == 22 && '1' || '' }}
          SP_RUST_BUILD_STD_DIR: ${{ runner.temp }}/rust-build-std
      - name: Static export builds
        run: pnpm --filter @sp/web build

  # The Windows targets model MSVC: their ground truth needs MSVC, which only Windows runners have.
  msvc:
    name: MSVC ground truth
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/cross-compiler.test.ts tests/cpp-compiler.test.ts tests/verification-program.test.ts
        env:
          SP_REQUIRE_MSVC: "1"
