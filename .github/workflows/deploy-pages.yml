name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the compilers the layout ground truth checks against
        uses: ./.github/actions/cross-compilers
        # A crawling mirror fails the run here, instead of holding it for the 6 h job limit.
        timeout-minutes: 60
      # Zig is the ground truth of the Zig tools (tests/zig-compiler.test.ts). Bindings are compiled by
      # their own languages (tests/bindings.test.ts): Zig and Rust check them for the target, C# with
      # .NET 9; Go and Python are on the runner already.
      - name: Install Zig, and the toolchains the bindings are checked with
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      # Every target the Rust bindings are written for: rustup ships the library of most; the tier-3
      # ones (MIPS, AVR) have core built from source on nightly (-Zbuild-std).
      - name: Add the Rust targets the bindings are checked for
        run: |
          rustup target add x86_64-pc-windows-msvc i686-unknown-linux-gnu i686-pc-windows-msvc armv7-unknown-linux-gnueabihf thumbv7em-none-eabihf aarch64-unknown-linux-gnu riscv32imac-unknown-none-elf riscv64gc-unknown-linux-gnu powerpc-unknown-linux-gnu
          rustup toolchain install nightly --profile minimal -c rust-src
      - run: pnpm typecheck && pnpm lint && pnpm test
        env:
          SP_REQUIRE_COMPILERS: "1"
          SP_REQUIRE_BINDING_TOOLCHAINS: "1"

      - name: Build static export
        run: pnpm --filter @sp/web build
        env:
          # Project sites are served from /<repo>; remove for a custom domain at the root.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          NEXT_PUBLIC_GITHUB_URL: ${{ github.server_url }}/${{ github.repository }}

      - run: touch apps/web/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  # The Windows targets model MSVC: their ground truth needs MSVC, which only Windows runners have.
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/cross-compiler.test.ts tests/cpp-compiler.test.ts tests/compiler.test.ts tests/verification-program.test.ts
        env:
          SP_REQUIRE_MSVC: "1"

  deploy:
    needs: [build, msvc]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
