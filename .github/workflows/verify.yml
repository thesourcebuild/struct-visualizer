name: Verify

on:
  pull_request:
  push:
    branches-ignore: [main, master]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # On one Node version: the compilers' answers do not depend on it. See deploy-pages.yml.
      - name: Install the compilers the bit-field ground truth checks against
        if: matrix.node == 22
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-i686-linux-gnu gcc-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu gcc-mipsel-linux-gnu gcc-mingw-w64-x86-64-win32 \
            gcc-mingw-w64-i686-win32 gcc-arm-none-eabi gcc-riscv64-unknown-elf gcc-avr avr-libc sdcc
      - run: pnpm typecheck
      - run: pnpm lint
      # TODO: add `pnpm format:check` after the one-off `pnpm format` commit
      # (kept separate from the monorepo move so git still detects the renames).
      - run: pnpm test
        env:
          # Fail, rather than skip, a target whose compiler did not install.
          SP_REQUIRE_COMPILERS: ${{ matrix.node == 22 && '1' || '' }}
      - name: Static export builds
        run: pnpm --filter @sp/web build
