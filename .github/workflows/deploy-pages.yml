name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the compilers the layout ground truth checks against
        uses: ./.github/actions/cross-compilers
        # A crawling mirror fails the run here, instead of holding it for the 6 h job limit.
        timeout-minutes: 60
      - run: pnpm typecheck && pnpm lint && pnpm test
        env:
          SP_REQUIRE_COMPILERS: "1"

      - name: Build static export
        run: pnpm --filter @sp/web build
        env:
          # Project sites are served from /<repo>; remove for a custom domain at the root.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          NEXT_PUBLIC_GITHUB_URL: ${{ github.server_url }}/${{ github.repository }}

      - run: touch apps/web/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  # The Windows targets model MSVC: their ground truth needs MSVC, which only Windows runners have.
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/cross-compiler.test.ts tests/cpp-compiler.test.ts tests/compiler.test.ts tests/verification-program.test.ts
        env:
          SP_REQUIRE_MSVC: "1"

  deploy:
    needs: [build, msvc]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
